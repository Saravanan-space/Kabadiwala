name: Keep Render Backend Awake

on:
  schedule:
    # Run every 10 minutes to prevent Render from entering sleep mode (15 min timeout)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          BACKEND_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            # Default Render endpoint for Kabadiwala backend
            BACKEND_URL="https://kabadiwala-c566.onrender.com"
          fi
          echo "Pinging $BACKEND_URL/health to keep it awake..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/health" || echo "failed")
          echo "Health check response code: $RESPONSE"
